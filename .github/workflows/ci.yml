name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check api tests tools

      - name: Format (black)
        run: uv run black --check api tests tools

      - name: Prepare sqlite schema for app-level routes
        run: |
          uv run python - <<'PY'
          import asyncio

          from api.core.config import settings
          from api.db.database import (
            create_all_tables_async,
            create_async_database_engine,
          )

          async def prepare() -> None:
              engine = create_async_database_engine(settings.database_url)
              await create_all_tables_async(engine)
              await engine.dispose()

          asyncio.run(prepare())
          PY

      - name: Run backend tests
        # 覆盖率门禁阈值在 pyproject [tool.coverage.report]（当前 87）：
        # 阈值与口径集中在 pyproject，CI 与本地 `uv run pytest --cov` 同源。
        run: uv run pytest tests --cov=api

  backend-postgres:
    name: backend (postgres parity)
    runs-on: ubuntu-latest
    # 生产库是 PostgreSQL 而既有 backend job 只在 SQLite 上跑：迁移链与仓储行为
    # （FK 强制、约束、JSON 列）从未被 CI 在真实 PG 上验证过，本 job 补这一层平价。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: echowhale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic（api/migrations/env.py 读 settings.database_url）与测试方言共用本库。
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/echowhale
      # 测试方言开关（tests/support/dialect.py）：让 FK 顺序用例落在真实 PG 上、
      # SQLite 专属用例显式 skip。不用 settings.database_url 做方言源，是为了
      # 不影响本地 .env 指向 dev 库时的默认测试行为。
      ECHOWHALE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/echowhale
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Run migrations against real PostgreSQL
        # 本 job 核心价值：完整 alembic 迁移链在真实 PG 上从零 upgrade 到 head，
        # 替代 SQLite 口径的 create_all（只验模型不验迁移脚本）。
        run: uv run alembic upgrade head

      - name: Run backend tests
        # 覆盖率门禁同 pyproject fail_under=87；SQLite 专属用例在此 job 显式
        # skip（理由见各用例标记）。CI 无 .env，model_runtime_mode 默认 mock。
        run: uv run pytest tests --cov=api

  docker:
    name: docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 构建但不推送：交付物可复现性进入门禁，发布推送另行接入（需 registry 凭证）。
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false

  frontend:
    name: frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        # Lint 先于 typecheck：hooks 依赖数组错误与 fast-refresh 边界问题
        # tsc 抓不住，先拦语义类回归再跑类型检查。
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (coverage thresholds)
        run: npm run coverage
