[project]
name = "echowhale"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.49",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "psycopg[binary]>=3.2.12",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.42.0",
    "deepgram-sdk>=6.1.1",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "alembic>=1.16.5",
    "pytest>=9.0.2",
]
